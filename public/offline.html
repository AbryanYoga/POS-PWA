<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mode Offline - POS System</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #F4F6F5;
      color: #1A2421;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background: #FFFFFF;
      max-width: 440px;
      width: 100%;
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.08);
      border: 1px solid #E2E8E5;
    }
    .offline-icon-wrapper {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #FEE2E2;
      color: #DC2626;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px auto;
    }
    .offline-icon-wrapper svg {
      width: 40px;
      height: 40px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1A2421;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      line-height: 1.5;
      color: #737D78;
      margin-bottom: 28px;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      background: #2B5D4F;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .btn-retry:hover {
      background: #1B3D34;
    }
    .btn-retry:active {
      transform: scale(0.98);
    }
    .offline-badge {
      margin-top: 20px;
      display: inline-block;
      font-size: 12px;
      font-weight: 500;
      color: #8C9993;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon-wrapper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Anda Sedang Offline</h1>
    <p>Aplikasi tidak dapat terhubung ke server. Periksa koneksi internet Wi-Fi atau data seluler Anda, lalu coba lagi.</p>
    <button class="btn-retry" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      Coba Muat Ulang
    </button>
    <div class="offline-badge">POS Kasir System · Standalone Shell</div>
  </div>
</body>
</html>
